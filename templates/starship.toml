# Template: rendered to ~/.config/starship.toml by ~/.config/plasma-rice/rice.py ({{name}} = palette colour)
# Two-line frame. Left: the jewel (where you are, in the accent: CachyOS's mark, or the git mark and the
# repo's name in bold inside a repo), the git pill (branch, an operation under way, what changed, how far
# from the remote), lines changed, the toolchains of the folder. Right, after the rule: how the last
# command went (exit code or signal, how long it took), background jobs, the clock. The prompt is on the
# line below. Once a command is entered, the frame shrinks to one line (shell/rice.zsh).
# Glyphs are written as escapes (Nerd Font private-use characters don't survive every editor).
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 400
scan_timeout = 20
continuation_prompt = "[ ∙ ](fg:{{muted}})"

format = """
[╭─](fg:{{outline}})\
($username$hostname )\
[](fg:{{primary}})$directory[](fg:{{primary}})\
( [](fg:{{primary_container}})$git_branch$git_commit$git_state$git_status[](fg:{{primary_container}}))\
$git_metrics\
$python$nodejs$bun$deno$rust$golang$java$lua$c$zig$docker_context\
$fill\
$status$cmd_duration$jobs\
$time
[╰─](fg:{{outline}})$character"""

# only over SSH, or as root (in red)
[username]
style_user = "fg:{{tertiary}}"
style_root = "fg:{{red}} bold"
format = "[$user]($style)"

[hostname]
ssh_symbol = ""
format = "[@$hostname](fg:{{tertiary}})"

# the jewel: CachyOS's mark and the path; in a repo the git mark, the repo's name in bold, the path in it
# (no "…/" for what lies above the repo: the mark says where it starts)
[directory]
style = "bg:{{primary}} fg:{{on_primary}}"
format = "[ $path]($style)[$read_only]($read_only_style)"
repo_root_style = "bg:{{primary}} fg:{{on_primary}} bold"
before_repo_root_style = "bg:{{primary}} fg:{{on_primary}}"
repo_root_format = "[\U000f02a2 ]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"
read_only = " \U000f033e"
read_only_style = "bg:{{primary}} fg:{{on_primary}}"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "\U000f0219"
"Downloads" = ""
"Music" = "\U000f075a"
"Pictures" = ""

# the git pill: deep accent, the branch in bold; what changed in its own colour
[git_branch]
symbol = "\U000f062c"
format = "[$symbol $branch](bg:{{primary_container}} fg:{{on_primary_container}} bold)"
only_attached = true            # a detached HEAD shows its commit instead
truncation_length = 28
truncation_symbol = "…"

[git_commit]
format = "[\U000f0718 $hash$tag](bg:{{primary_container}} fg:{{on_primary_container}} bold)"
tag_disabled = false
tag_symbol = " \U000f04fc "

[git_state]
format = "[ \U000f062d $state( $progress_current/$progress_total)](bg:{{primary_container}} fg:{{orange}} bold)"
rebase = "rebasing"
merge = "merging"
revert = "reverting"
cherry_pick = "picking"
bisect = "bisecting"
am = "am"
am_or_rebase = "am/rebase"

[git_status]
format = "$all_status$ahead_behind"
conflicted = "[ \U000f0026 $count](bg:{{primary_container}} fg:{{red}} bold)"
staged = "[ \U000f012c $count](bg:{{primary_container}} fg:{{green}})"
modified = "[ \U000f03eb $count](bg:{{primary_container}} fg:{{yellow}})"
renamed = "[ \U000f0054 $count](bg:{{primary_container}} fg:{{teal}})"
deleted = "[ \U000f09e7 $count](bg:{{primary_container}} fg:{{red}})"
typechanged = ""
untracked = "[ ?$count](bg:{{primary_container}} fg:{{on_surface_variant}})"
stashed = "[ \U000f03d7 $count](bg:{{primary_container}} fg:{{magenta}})"
ahead = "[ \U000f19b2$count](bg:{{primary_container}} fg:{{cyan}})"
behind = "[ \U000f19b3$count](bg:{{primary_container}} fg:{{orange}})"
diverged = "[ \U000f19b2$ahead_count\U000f19b3$behind_count](bg:{{primary_container}} fg:{{orange}})"
up_to_date = ""

[git_metrics]
disabled = false
format = "( [+$added](fg:{{green_dim}}))( [-$deleted](fg:{{red_dim}}))"

# toolchains: quiet, major.minor only
[python]
symbol = ""
format = " [$symbol $version( \U000f0320 $virtualenv)](fg:{{muted}})"
version_format = "${major}.${minor}"

[nodejs]
symbol = ""
format = " [$symbol $version](fg:{{muted}})"
version_format = "${major}.${minor}"

[bun]
format = " [bun $version](fg:{{muted}})"
version_format = "${major}.${minor}"

[deno]
format = " [deno $version](fg:{{muted}})"
version_format = "${major}.${minor}"

[rust]
symbol = ""
format = " [$symbol $version](fg:{{muted}})"
version_format = "${major}.${minor}"

[golang]
symbol = ""
format = " [$symbol $version](fg:{{muted}})"
version_format = "${major}.${minor}"

[java]
symbol = "\U000f0b37"
format = " [$symbol $version](fg:{{muted}})"
version_format = "${major}"

[lua]
symbol = "\U000f08b1"
format = " [$symbol $version](fg:{{muted}})"
version_format = "${major}.${minor}"

[c]
symbol = "\U000f0671"
format = " [$symbol $name $version](fg:{{muted}})"
version_format = "${major}.${minor}"

[zig]
format = " [zig $version](fg:{{muted}})"
version_format = "${major}.${minor}"

[docker_context]
symbol = "\U000f0868"
format = " [$symbol $context](fg:{{muted}})"

[fill]
symbol = "─"
style = "fg:{{surface_highest}}"

# right side: the last command's exit code (its icon tells a signal, not found, not executable), how long it took, jobs
[status]
disabled = false
format = " [$symbol$status](fg:{{red}})"
symbol = "\U000f0156 "
not_executable_symbol = "\U000f0341 "
not_found_symbol = "\U000f02d6 "
sigint_symbol = "\U000f073a "
signal_symbol = "\U000f0241 "
map_symbol = true

[cmd_duration]
min_time = 2000
format = " [\U000f051f $duration](fg:{{yellow}})"

[jobs]
symbol = "\U000f08bb "
symbol_threshold = 1
number_threshold = 1
format = " [$symbol$number](fg:{{teal}})"

[time]
disabled = false
time_format = "%R"
format = " [](fg:{{surface_container}})[\U000f0954 $time](bg:{{surface_container}} fg:{{on_surface_variant}})[](fg:{{surface_container}})"

[character]
success_symbol = "[❯](bold fg:{{primary}})"
error_symbol = "[❯](bold fg:{{red}})"
vimcmd_symbol = "[❮](bold fg:{{tertiary}})"
