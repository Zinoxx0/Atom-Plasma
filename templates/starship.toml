# Template: rendered to ~/.config/starship.toml by ~/.config/plasma-rice/rice.py ({{name}} = palette colour)
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓]({{tertiary}})\
$os\
[](bg:{{primary}} fg:{{tertiary}})\
$directory\
[](fg:{{primary}} bg:{{surface_highest}})\
$git_branch\
$git_status\
[](fg:{{surface_highest}} bg:{{surface_high}})\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:{{surface_high}} bg:{{surface_container}})\
$time\
[ ](fg:{{surface_container}})\
\n$character"""

[directory]
style = "fg:{{on_primary}} bg:{{primary}}"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:{{surface_highest}}"
format = '[[ $symbol $branch ](fg:{{primary}} bg:{{surface_highest}})]($style)'

[git_status]
style = "bg:{{surface_highest}}"
format = '[[($all_status$ahead_behind )](fg:{{primary}} bg:{{surface_highest}})]($style)'

[nodejs]
symbol = ""
style = "bg:{{surface_high}}"
format = '[[ $symbol ($version) ](fg:{{primary}} bg:{{surface_high}})]($style)'

[bun]
symbol = ""
style = "bg:{{surface_high}}"
format = '[[ $symbol ($version) ](fg:{{primary}} bg:{{surface_high}})]($style)'

[rust]
symbol = ""
style = "bg:{{surface_high}}"
format = '[[ $symbol ($version) ](fg:{{primary}} bg:{{surface_high}})]($style)'

[golang]
symbol = ""
style = "bg:{{surface_high}}"
format = '[[ $symbol ($version) ](fg:{{primary}} bg:{{surface_high}})]($style)'

[php]
symbol = ""
style = "bg:{{surface_high}}"
format = '[[ $symbol ($version) ](fg:{{primary}} bg:{{surface_high}})]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:{{surface_container}}"
format = '[[  $time ](fg:{{on_surface_variant}} bg:{{surface_container}})]($style)'

[os]
style = "bg:{{tertiary}} fg:{{on_tertiary}}"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
