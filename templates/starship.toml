# Template: rendered to ~/.config/starship.toml by ~/.config/plasma-rice/rice.py ({{name}} = palette colour)
# Two-line frame: a rounded pill for where you are (os + path, the accent), a quiet pill for git,
# language versions as plain text, a rule to the clock on the right; the prompt on the line below.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 400
scan_timeout = 20

format = """
[╭─](fg:{{outline}})\
[](fg:{{primary}})$os$directory[](fg:{{primary}})\
$git_branch$git_status\
$nodejs$bun$rust$golang$python\
$cmd_duration\
$fill\
$time
[╰─](fg:{{outline}})$character"""

[os]
disabled = false
style = "bg:{{primary}} fg:{{on_primary}}"
format = "[$symbol ]($style)"

[directory]
style = "bg:{{primary}} fg:{{on_primary}} bold"
read_only = " 󰌾"
read_only_style = "bg:{{primary}} fg:{{on_primary}}"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""

[git_branch]
symbol = ""
format = " [](fg:{{surface_high}})[$symbol $branch](bg:{{surface_high}} fg:{{tertiary}})[](fg:{{surface_high}})"

[git_status]
format = "[( $all_status$ahead_behind)](fg:{{yellow}})"

[nodejs]
symbol = ""
format = " [$symbol $version](fg:{{muted}})"

[bun]
format = " [bun $version](fg:{{muted}})"

[rust]
symbol = ""
format = " [$symbol $version](fg:{{muted}})"

[golang]
symbol = ""
format = " [$symbol $version](fg:{{muted}})"

[python]
symbol = ""
format = " [$symbol $version( $virtualenv)](fg:{{muted}})"

[cmd_duration]
min_time = 2000
format = " [󰔟 $duration](fg:{{yellow}})"

[fill]
symbol = "─"
style = "fg:{{surface_highest}}"

[time]
disabled = false
time_format = "%R"
format = "[](fg:{{surface_container}})[󰥔 $time](bg:{{surface_container}} fg:{{on_surface_variant}})[](fg:{{surface_container}})"

[character]
success_symbol = "[❯](bold fg:{{primary}})"
error_symbol = "[❯](bold fg:{{red}})"
vimcmd_symbol = "[❮](bold fg:{{tertiary}})"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
