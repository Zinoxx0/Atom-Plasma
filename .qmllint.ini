; qmllint's settings for this repository (Qt 6: /usr/lib/qt6/bin/qmllint), so an editor's QML support and
; tests/test_qmllint.py agree on what's an error: the mistakes that stop a component from loading. Everything
; else stays a warning to read. Run it from the checkout with the shared modules on the path:
;   /usr/lib/qt6/bin/qmllint -I qml -I ~/.local/lib/qt6/qml FILE.qml
; (an import path here would be read relative to each file, so it can't be set once for the repository)
[General]
DisableDefaultImports=false

[Warnings]
UnqualifiedAccess=warning
RequiredProperty=error
Syntax=error
DuplicatePropertyBinding=error
ReadOnlyProperty=error
BadSignalHandlerParameters=error
